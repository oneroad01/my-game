<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>横スクロールゲーム</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: skyblue;
  font-family: sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: linear-gradient(#57c3ff, #d8f4ff);
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.7) 0 30px, transparent 31px),
    radial-gradient(circle at 60% 15%, rgba(255,255,255,0.7) 0 25px, transparent 26px),
    linear-gradient(#57c3ff, #d8f4ff);
}

#world {
  position: absolute;
  left: 0;
  top: 0;
  width: 3200px;
  height: 540px;
}

/* HUD */
#hud {
  position: fixed;
  top: 12px;
  left: 16px;
  z-index: 100;
  color: white;
  text-shadow: 2px 2px 4px black;
  font-weight: bold;
  font-size: 24px;
  line-height: 1.5;
}

#life {
  letter-spacing: 3px;
}

/* 主人公 */
#player {
  position: absolute;
  width: 56px;
  height: 56px;
  background-image: url("ヒーロー.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center bottom;
  z-index: 20;
  transform-origin: center bottom;
  image-rendering: pixelated;
}

#player.running {
  animation: runBob 0.22s infinite alternate;
}

#player.invincible {
  animation:
    flash 0.14s infinite alternate,
    runBob 0.22s infinite alternate;
}

@keyframes runBob {
  0% {
    transform: translateY(0px) scaleX(1) scaleY(1);
  }
  100% {
    transform: translateY(-3px) scaleX(1) scaleY(0.96);
  }
}

@keyframes flash {
  0% { opacity: 1; }
  100% { opacity: 0.35; }
}

/* 地面 */
.ground {
  position: absolute;
  left: 0;
  top: 420px;
  width: 3200px;
  height: 160px;
  background: #38a83b;
  border-top: 10px solid #77db5d;
}

.ground::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,0.06) 0 24px,
      rgba(255,255,255,0.03) 24px 48px);
  opacity: 0.35;
}

/* 足場 */
.platform {
  position: absolute;
  height: 22px;
  background: #8b4513;
  border-top: 5px solid #d08a44;
}

/* コイン */
.coin {
  position: absolute;
  width: 26px;
  height: 26px;
  background: gold;
  border: 4px solid #e6a800;
  border-radius: 50%;
  z-index: 5;
}

/* 敵：ドンペン風オリジナル */
.enemy {
  position: absolute;
  width: 52px;
  height: 52px;
  z-index: 15;
  transform-origin: center bottom;
}

.enemy-body {
  position: absolute;
  inset: 2px 4px 6px 4px;
  background: #1b7be0;
  border: 2px solid #0a4691;
  border-radius: 50% 50% 44% 44%;
}

.enemy-belly {
  position: absolute;
  left: 13px;
  top: 20px;
  width: 24px;
  height: 18px;
  background: #fffef8;
  border-radius: 50%;
}

.enemy-beak {
  position: absolute;
  left: 18px;
  top: 20px;
  width: 14px;
  height: 8px;
  background: #ffd54d;
  border-radius: 5px;
}

.enemy-eye {
  position: absolute;
  top: 15px;
  width: 8px;
  height: 10px;
  background: white;
  border-radius: 50%;
}

.enemy-eye::after {
  content: "";
  position: absolute;
  left: 2px;
  top: 3px;
  width: 4px;
  height: 4px;
  background: #111;
  border-radius: 50%;
}

.enemy-eye.left {
  left: 12px;
}

.enemy-eye.right {
  right: 12px;
}

.enemy-cap {
  position: absolute;
  left: 12px;
  top: 2px;
  width: 26px;
  height: 10px;
  background: #e63946;
  border-radius: 8px 8px 4px 4px;
  transform: rotate(-8deg);
}

.enemy-pom {
  position: absolute;
  left: 33px;
  top: -1px;
  width: 10px;
  height: 10px;
  background: #ffd54d;
  border-radius: 50%;
}

.enemy-scarf {
  position: absolute;
  left: 10px;
  top: 28px;
  width: 30px;
  height: 6px;
  background: #ffd54d;
  border-radius: 6px;
}

.enemy-foot {
  position: absolute;
  bottom: 0;
  width: 12px;
  height: 7px;
  background: #ff9f1c;
  border-radius: 5px;
}

.enemy-foot.left {
  left: 11px;
}

.enemy-foot.right {
  right: 11px;
}

.enemy.running {
  animation: enemyBob 0.28s infinite alternate;
}

@keyframes enemyBob {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-2px); }
}

/* ゴール */
#goalPole {
  position: absolute;
  left: 2950px;
  top: 180px;
  width: 12px;
  height: 240px;
  background: white;
}

#flag {
  position: absolute;
  left: 2962px;
  top: 190px;
  width: 80px;
  height: 52px;
  background: #e63946;
}

/* メッセージ */
#message {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 300;
  color: white;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  font-weight: bold;
  padding: 20px;
}

#messageTitle {
  font-size: 54px;
}

#messageText {
  font-size: 26px;
  margin-top: 16px;
}

#restartButton {
  margin-top: 28px;
  padding: 14px 28px;
  border: 3px solid white;
  border-radius: 16px;
  background: #e63946;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

/* スマホ操作 */
#mobileControls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 18px;
  height: 110px;
  z-index: 150;
  pointer-events: none;
}

.controlButton {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid white;
  background: rgba(0,0,0,0.45);
  color: white;
  font-size: 32px;
  font-weight: bold;
  pointer-events: auto;
  touch-action: none;
}

#leftBtn { left: 20px; }
#rightBtn { left: 115px; }

#jumpBtn {
  right: 25px;
  width: 100px;
  height: 100px;
  background: rgba(220,40,40,0.82);
  font-size: 19px;
}

.controlButton:active {
  transform: scale(0.92);
}
</style>
</head>

<body>

<div id="hud">
  <div id="score">COIN × 0</div>
  <div id="life">LIFE ❤️❤️❤️</div>
</div>

<div id="game">
  <div id="world">

    <div id="player"></div>

    <div class="ground"></div>

    <div class="platform" style="left:520px;top:340px;width:170px;"></div>
    <div class="platform" style="left:920px;top:285px;width:170px;"></div>
    <div class="platform" style="left:1450px;top:350px;width:190px;"></div>
    <div class="platform" style="left:2050px;top:300px;width:180px;"></div>
    <div class="platform" style="left:2460px;top:260px;width:180px;"></div>

    <div class="coin" style="left:565px;top:300px;"></div>
    <div class="coin" style="left:970px;top:245px;"></div>
    <div class="coin" style="left:1510px;top:310px;"></div>
    <div class="coin" style="left:2105px;top:260px;"></div>
    <div class="coin" style="left:2515px;top:220px;"></div>
    <div class="coin" style="left:2760px;top:385px;"></div>

    <div class="enemy" id="enemy1">
      <div class="enemy-body"></div>
      <div class="enemy-belly"></div>
      <div class="enemy-beak"></div>
      <div class="enemy-cap"></div>
      <div class="enemy-pom"></div>
      <div class="enemy-scarf"></div>
      <div class="enemy-eye left"></div>
      <div class="enemy-eye right"></div>
      <div class="enemy-foot left"></div>
      <div class="enemy-foot right"></div>
    </div>

    <div class="enemy" id="enemy2">
      <div class="enemy-body"></div>
      <div class="enemy-belly"></div>
      <div class="enemy-beak"></div>
      <div class="enemy-cap"></div>
      <div class="enemy-pom"></div>
      <div class="enemy-scarf"></div>
      <div class="enemy-eye left"></div>
      <div class="enemy-eye right"></div>
      <div class="enemy-foot left"></div>
      <div class="enemy-foot right"></div>
    </div>

    <div class="enemy" id="enemy3">
      <div class="enemy-body"></div>
      <div class="enemy-belly"></div>
      <div class="enemy-beak"></div>
      <div class="enemy-cap"></div>
      <div class="enemy-pom"></div>
      <div class="enemy-scarf"></div>
      <div class="enemy-eye left"></div>
      <div class="enemy-eye right"></div>
      <div class="enemy-foot left"></div>
      <div class="enemy-foot right"></div>
    </div>

    <div id="goalPole"></div>
    <div id="flag"></div>

  </div>
</div>

<div id="mobileControls">
  <button class="controlButton" id="leftBtn">←</button>
  <button class="controlButton" id="rightBtn">→</button>
  <button class="controlButton" id="jumpBtn">JUMP</button>
</div>

<div id="message">
  <div id="messageTitle">GAME CLEAR!</div>
  <div id="messageText"></div>
  <button id="restartButton">もう一度</button>
</div>

<script>
const world = document.getElementById("world");
const player = document.getElementById("player");
const platforms = document.querySelectorAll(".platform");
const coinElements = document.querySelectorAll(".coin");
const scoreDisplay = document.getElementById("score");
const lifeDisplay = document.getElementById("life");

const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");

let x = 100;
let y = 364;
let velocityY = 0;

const gravity = 0.8;
const jumpPower = -15;
const playerWidth = 56;
const playerHeight = 56;
const groundY = 364;

let onGround = true;
let score = 0;
let cameraX = 0;
let gameEnded = false;
let facingRight = true;

let life = 3;
let invincible = false;
let invincibleTimer = 0;

const keys = {};

const coins = [];

coinElements.forEach(function(el) {
  coins.push({
    el: el,
    x: parseInt(el.style.left),
    y: parseInt(el.style.top),
    collected: false
  });
});

const enemies = [
  {
    el: document.getElementById("enemy1"),
    x: 760,
    y: 370,
    width: 52,
    height: 52,
    speed: 2.1,
    minX: 680,
    maxX: 900,
    alive: true,
    vy: 0,
    onGround: true,
    jumpPower: -9.5
  },
  {
    el: document.getElementById("enemy2"),
    x: 1710,
    y: 370,
    width: 52,
    height: 52,
    speed: 1.8,
    minX: 1600,
    maxX: 1880,
    alive: true,
    vy: 0,
    onGround: true,
    jumpPower: -10
  },
  {
    el: document.getElementById("enemy3"),
    x: 2570,
    y: 370,
    width: 52,
    height: 52,
    speed: 2.2,
    minX: 2440,
    maxX: 2720,
    alive: true,
    vy: 0,
    onGround: true,
    jumpPower: -9
  }
];

function updateLifeDisplay() {
  lifeDisplay.textContent = "LIFE " + "❤️".repeat(life);
}

function isTouching(ax, ay, aw, ah, bx, by, bw, bh) {
  return (
    ax < bx + bw &&
    ax + aw > bx &&
    ay < by + bh &&
    ay + ah > by
  );
}

function damagePlayer() {
  if (invincible || gameEnded) return;

  life--;
  updateLifeDisplay();

  if (life <= 0) {
    gameEnded = true;
    showMessage("GAME OVER", "ライフがなくなりました");
    return;
  }

  invincible = true;
  invincibleTimer = 90;

  x = Math.max(0, x - 90);
  y = groundY;
  velocityY = 0;
}

function showMessage(title, text) {
  messageTitle.textContent = title;
  messageText.textContent = text;
  message.style.display = "flex";
}

document.addEventListener("keydown", function(e) {
  keys[e.key] = true;

  if ((e.key === " " || e.key === "ArrowUp") && onGround && !gameEnded) {
    velocityY = jumpPower;
    onGround = false;
  }

  if (
    e.key === "ArrowLeft" ||
    e.key === "ArrowRight" ||
    e.key === " " ||
    e.key === "ArrowUp"
  ) {
    e.preventDefault();
  }
});

document.addEventListener("keyup", function(e) {
  keys[e.key] = false;
});

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const jumpBtn = document.getElementById("jumpBtn");

leftBtn.addEventListener("pointerdown", function(e) {
  e.preventDefault();
  keys["ArrowLeft"] = true;
});
leftBtn.addEventListener("pointerup", function(e) {
  e.preventDefault();
  keys["ArrowLeft"] = false;
});
leftBtn.addEventListener("pointercancel", function() {
  keys["ArrowLeft"] = false;
});
leftBtn.addEventListener("pointerleave", function() {
  keys["ArrowLeft"] = false;
});

rightBtn.addEventListener("pointerdown", function(e) {
  e.preventDefault();
  keys["ArrowRight"] = true;
});
rightBtn.addEventListener("pointerup", function(e) {
  e.preventDefault();
  keys["ArrowRight"] = false;
});
rightBtn.addEventListener("pointercancel", function() {
  keys["ArrowRight"] = false;
});
rightBtn.addEventListener("pointerleave", function() {
  keys["ArrowRight"] = false;
});

jumpBtn.addEventListener("pointerdown", function(e) {
  e.preventDefault();
  if (onGround && !gameEnded) {
    velocityY = jumpPower;
    onGround = false;
  }
});

function updateEnemies() {
  enemies.forEach(function(enemy) {
    if (!enemy.alive) return;

    enemy.x += enemy.speed;

    if (enemy.x <= enemy.minX) {
      enemy.x = enemy.minX;
      enemy.speed = Math.abs(enemy.speed);
      enemy.el.style.transform = "scaleX(1)";
    }

    if (enemy.x >= enemy.maxX) {
      enemy.x = enemy.maxX;
      enemy.speed = -Math.abs(enemy.speed);
      enemy.el.style.transform = "scaleX(-1)";
    }

    enemy.el.classList.add("running");

    if (enemy.onGround && Math.random() < 0.008) {
      enemy.vy = enemy.jumpPower;
      enemy.onGround = false;
    }

    enemy.vy += 0.55;
    enemy.y += enemy.vy;

    if (enemy.y >= 370) {
      enemy.y = 370;
      enemy.vy = 0;
      enemy.onGround = true;
    }

    enemy.el.style.left = enemy.x + "px";
    enemy.el.style.top = enemy.y + "px";
  });
}

function updatePlayer() {
  if (gameEnded) return;

  let moving = false;

  if (keys["ArrowRight"]) {
    x += 6;
    facingRight = true;
    moving = true;
  }

  if (keys["ArrowLeft"]) {
    x -= 6;
    facingRight = false;
    moving = true;
  }

  if (x < 0) x = 0;
  if (x > 3140) x = 3140;

  const oldY = y;

  velocityY += gravity;
  y += velocityY;

  onGround = false;

  if (y >= groundY) {
    y = groundY;
    velocityY = 0;
    onGround = true;
  }

  platforms.forEach(function(platform) {
    const px = parseInt(platform.style.left);
    const py = parseInt(platform.style.top);
    const pw = parseInt(platform.style.width);

    const playerBottom = y + playerHeight;
    const oldBottom = oldY + playerHeight;

    const hitX = x + playerWidth > px && x < px + pw;
    const falling = velocityY >= 0;
    const crossedTop = oldBottom <= py && playerBottom >= py;

    if (hitX && falling && crossedTop) {
      y = py - playerHeight;
      velocityY = 0;
      onGround = true;
    }
  });

  coins.forEach(function(coin) {
    if (coin.collected) return;

    if (
      isTouching(
        x, y, playerWidth, playerHeight,
        coin.x, coin.y, 26, 26
      )
    ) {
      coin.collected = true;
      coin.el.style.display = "none";
      score++;
      scoreDisplay.textContent = "COIN × " + score;
    }
  });

  enemies.forEach(function(enemy) {
    if (!enemy.alive) return;

    if (
      isTouching(
        x, y, playerWidth, playerHeight,
        enemy.x, enemy.y, enemy.width, enemy.height
      )
    ) {
      const oldBottom = oldY + playerHeight;

      if (velocityY > 0 && oldBottom <= enemy.y + 12) {
        enemy.alive = false;
        enemy.el.style.display = "none";
        velocityY = -10;
        score += 3;
        scoreDisplay.textContent = "COIN × " + score;
      } else {
        damagePlayer();
      }
    }
  });

  if (
    isTouching(
      x, y, playerWidth, playerHeight,
      2940, 180, 120, 240
    )
  ) {
    gameEnded = true;
    showMessage("GAME CLEAR!", "スコア：" + score);
  }

  player.classList.remove("running", "invincible");

  if (moving && onGround) {
    player.classList.add("running");
  }

  if (invincible) {
    player.classList.add("invincible");
  }

  if (facingRight) {
    player.style.transform = "";
  } else {
    player.style.transform = "scaleX(-1)";
  }

  if (player.classList.contains("running") && !facingRight) {
    player.style.transform = "scaleX(-1)";
  }
  if (player.classList.contains("invincible") && !facingRight) {
    player.style.transform = "scaleX(-1)";
  }
}

function updateInvincible() {
  if (!invincible) return;

  invincibleTimer--;

  if (invincibleTimer <= 0) {
    invincible = false;
  }
}

function drawPositions() {
  player.style.left = x + "px";
  player.style.top = y + "px";

  cameraX = x - window.innerWidth * 0.35;
  if (cameraX < 0) cameraX = 0;

  const maxCamera = 3200 - window.innerWidth;
  if (cameraX > maxCamera) {
    cameraX = Math.max(0, maxCamera);
  }

  world.style.left = -cameraX + "px";
}

function gameLoop() {
  updatePlayer();
  updateEnemies();
  updateInvincible();
  drawPositions();
  requestAnimationFrame(gameLoop);
}

document.getElementById("restartButton").addEventListener("click", function() {
  location.reload();
});

updateLifeDisplay();
gameLoop();
</script>

</body>
</html>

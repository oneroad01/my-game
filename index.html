<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>横スクロールゲーム</title>

<style>
* { box-sizing:border-box; }

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#58c5ff;
  font-family:sans-serif;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(#58c5ff,#d9f5ff);
}

#world{
  position:absolute;
  width:3200px;
  height:540px;
  left:0;
  top:0;
}

/* =====================
   主人公
===================== */

#player{
  position:absolute;
  width:50px;
  height:84px;
  z-index:20;
}

#heroSprite{
  position:absolute;
  width:96px;
  height:128px;

  left:-23px;
  top:-44px;

  background-image:url("hero_sheet.png");
  background-repeat:no-repeat;

  background-size:600% 100%;
  background-position:0% 0;

  image-rendering:pixelated;
  transform-origin:center bottom;
}

/* ダメージ中点滅 */

.invincible{
  animation:flash 0.12s infinite alternate;
}

@keyframes flash{
  from{opacity:1;}
  to{opacity:0.25;}
}

/* =====================
   地面
===================== */

.ground{
  position:absolute;
  left:0;
  top:420px;

  width:3200px;
  height:160px;

  background:#8c522b;
  border-top:14px solid #56bc42;
}

/* =====================
   足場
===================== */

.platform{
  position:absolute;
  height:24px;

  background:#87451f;
  border-top:6px solid #c9803b;
}

/* =====================
   コイン
===================== */

.coin{
  position:absolute;

  width:28px;
  height:28px;

  border-radius:50%;

  background:#ffd700;
  border:4px solid #dc9900;

  box-shadow:
    inset 4px 0 rgba(255,255,255,.55);
}

/* =====================
   青ペンギン風の敵
===================== */

.enemy{
  position:absolute;

  width:54px;
  height:54px;

  z-index:15;

  transform-origin:center bottom;
}

.enemyBody{
  position:absolute;

  left:4px;
  top:5px;

  width:46px;
  height:46px;

  background:#157bdc;

  border:3px solid #073e88;

  border-radius:50% 50% 44% 44%;
}

.enemyBelly{
  position:absolute;

  left:15px;
  top:25px;

  width:25px;
  height:20px;

  background:white;

  border-radius:50%;
}

.enemyHat{
  position:absolute;

  left:9px;
  top:0;

  width:30px;
  height:12px;

  background:#ed3042;

  border:2px solid #981f2b;

  border-radius:15px 15px 4px 4px;

  transform:rotate(-10deg);
}

.enemyHatBall{
  position:absolute;

  left:37px;
  top:-2px;

  width:11px;
  height:11px;

  background:#ffd326;

  border-radius:50%;
}

.enemyEye{
  position:absolute;

  top:16px;

  width:9px;
  height:11px;

  background:white;

  border-radius:50%;
}

.enemyEye::after{
  content:"";

  position:absolute;

  left:3px;
  top:4px;

  width:4px;
  height:4px;

  border-radius:50%;

  background:black;
}

.enemyEye.left{
  left:12px;
}

.enemyEye.right{
  right:12px;
}

.enemyBeak{
  position:absolute;

  left:19px;
  top:23px;

  width:16px;
  height:8px;

  background:#ffd22e;

  border-radius:5px;
}

.enemyScarf{
  position:absolute;

  left:10px;
  top:32px;

  width:34px;
  height:7px;

  background:#ffd22e;

  border-radius:5px;
}

.enemyFoot{
  position:absolute;

  bottom:0;

  width:14px;
  height:7px;

  background:#ff9818;

  border-radius:6px;
}

.enemyFoot.left{
  left:10px;
}

.enemyFoot.right{
  right:10px;
}

/* =====================
   ゴール
===================== */

#goalPole{
  position:absolute;

  left:2960px;
  top:175px;

  width:12px;
  height:245px;

  background:white;
}

#flag{
  position:absolute;

  left:2972px;
  top:185px;

  width:85px;
  height:55px;

  background:#ed3042;
}

/* =====================
   スコア・ライフ
===================== */

#hud{
  position:fixed;

  top:12px;
  left:18px;

  z-index:100;

  color:white;

  font-size:25px;
  font-weight:bold;

  text-shadow:2px 2px 4px black;
}

#life{
  margin-top:5px;
}

/* =====================
   終了画面
===================== */

#message{
  display:none;

  position:fixed;

  inset:0;

  z-index:300;

  background:rgba(0,0,0,.72);

  color:white;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  text-align:center;
}

#messageTitle{
  font-size:55px;
  font-weight:bold;
}

#messageText{
  margin-top:16px;
  font-size:25px;
}

#restart{
  margin-top:30px;

  padding:15px 30px;

  border:3px solid white;
  border-radius:15px;

  background:#e63946;

  color:white;

  font-size:22px;
  font-weight:bold;
}

/* =====================
   iPhone操作
===================== */

#controls{
  position:fixed;

  left:0;
  right:0;
  bottom:18px;

  height:110px;

  z-index:200;

  pointer-events:none;
}

.control{
  position:absolute;

  width:80px;
  height:80px;

  border-radius:50%;

  border:3px solid white;

  background:rgba(0,0,0,.45);

  color:white;

  font-size:32px;
  font-weight:bold;

  pointer-events:auto;

  touch-action:none;
}

#leftBtn{
  left:20px;
}

#rightBtn{
  left:115px;
}

#jumpBtn{
  right:25px;

  width:100px;
  height:100px;

  background:rgba(220,40,40,.82);

  font-size:18px;
}
</style>
</head>

<body>

<div id="hud">
  <div id="score">COIN × 0</div>
  <div id="life">LIFE ❤️❤️❤️</div>
</div>

<div id="game">

<div id="world">

  <div id="player">
    <div id="heroSprite"></div>
  </div>

  <div class="ground"></div>

  <!-- 足場 -->

  <div class="platform"
  style="left:500px;top:335px;width:180px;"></div>

  <div class="platform"
  style="left:900px;top:285px;width:180px;"></div>

  <div class="platform"
  style="left:1450px;top:340px;width:190px;"></div>

  <div class="platform"
  style="left:2050px;top:295px;width:190px;"></div>

  <div class="platform"
  style="left:2460px;top:255px;width:190px;"></div>

  <!-- コイン -->

  <div class="coin"
  style="left:560px;top:290px;"></div>

  <div class="coin"
  style="left:960px;top:240px;"></div>

  <div class="coin"
  style="left:1510px;top:295px;"></div>

  <div class="coin"
  style="left:2110px;top:250px;"></div>

  <div class="coin"
  style="left:2520px;top:210px;"></div>

  <div class="coin"
  style="left:2780px;top:375px;"></div>

  <!-- 敵 -->

  <div class="enemy" id="enemy1">
    <div class="enemyBody"></div>
    <div class="enemyBelly"></div>
    <div class="enemyHat"></div>
    <div class="enemyHatBall"></div>
    <div class="enemyEye left"></div>
    <div class="enemyEye right"></div>
    <div class="enemyBeak"></div>
    <div class="enemyScarf"></div>
    <div class="enemyFoot left"></div>
    <div class="enemyFoot right"></div>
  </div>

  <div class="enemy" id="enemy2">
    <div class="enemyBody"></div>
    <div class="enemyBelly"></div>
    <div class="enemyHat"></div>
    <div class="enemyHatBall"></div>
    <div class="enemyEye left"></div>
    <div class="enemyEye right"></div>
    <div class="enemyBeak"></div>
    <div class="enemyScarf"></div>
    <div class="enemyFoot left"></div>
    <div class="enemyFoot right"></div>
  </div>

  <div class="enemy" id="enemy3">
    <div class="enemyBody"></div>
    <div class="enemyBelly"></div>
    <div class="enemyHat"></div>
    <div class="enemyHatBall"></div>
    <div class="enemyEye left"></div>
    <div class="enemyEye right"></div>
    <div class="enemyBeak"></div>
    <div class="enemyScarf"></div>
    <div class="enemyFoot left"></div>
    <div class="enemyFoot right"></div>
  </div>

  <div id="goalPole"></div>
  <div id="flag"></div>

</div>
</div>

<!-- iPhone操作 -->

<div id="controls">
  <button class="control" id="leftBtn">←</button>
  <button class="control" id="rightBtn">→</button>
  <button class="control" id="jumpBtn">JUMP</button>
</div>

<!-- 終了画面 -->

<div id="message">

  <div id="messageTitle"></div>

  <div id="messageText"></div>

  <button id="restart">
    もう一度
  </button>

</div>

<script>

const world =
document.getElementById("world");

const player =
document.getElementById("player");

const hero =
document.getElementById("heroSprite");

const platforms =
document.querySelectorAll(".platform");

const coinElements =
document.querySelectorAll(".coin");

const scoreText =
document.getElementById("score");

const lifeText =
document.getElementById("life");

const message =
document.getElementById("message");

const messageTitle =
document.getElementById("messageTitle");

const messageText =
document.getElementById("messageText");


/* =====================
   プレイヤー
===================== */

let x = 100;
let y = 336;

let vy = 0;

const playerW = 50;
const playerH = 84;

const groundY = 336;

const gravity = 0.8;
const jumpPower = -15;

let onGround = true;

let facingRight = true;


/* =====================
   主人公アニメ
===================== */

/*

0 = 停止

1～4 = 走り

5 = ジャンプ

*/

let runFrame = 1;

let animationCounter = 0;


function setHeroFrame(frame){

  const positions = [
    0,
    20,
    40,
    60,
    80,
    100
  ];

  hero.style.backgroundPosition =
  positions[frame] + "% 0";
}


/* =====================
   ゲーム状態
===================== */

let score = 0;

let life = 3;

let gameEnded = false;

let cameraX = 0;

let invincible = false;

let invincibleTimer = 0;

const keys = {};


/* =====================
   コイン
===================== */

const coins = [];

coinElements.forEach(function(el){

  coins.push({

    el:el,

    x:parseInt(el.style.left),

    y:parseInt(el.style.top),

    taken:false

  });

});


/* =====================
   敵
===================== */

const enemies = [

{
  el:document.getElementById("enemy1"),

  x:750,
  y:366,

  w:54,
  h:54,

  vx:2,

  minX:680,
  maxX:890,

  vy:0,

  jump:-9,

  onGround:true,

  alive:true
},

{
  el:document.getElementById("enemy2"),

  x:1700,
  y:366,

  w:54,
  h:54,

  vx:1.8,

  minX:1580,
  maxX:1880,

  vy:0,

  jump:-10,

  onGround:true,

  alive:true
},

{
  el:document.getElementById("enemy3"),

  x:2580,
  y:366,

  w:54,
  h:54,

  vx:2.2,

  minX:2420,
  maxX:2760,

  vy:0,

  jump:-9,

  onGround:true,

  alive:true
}

];


/* =====================
   当たり判定
===================== */

function hit(
ax,ay,aw,ah,
bx,by,bw,bh
){

return(

ax < bx+bw &&

ax+aw > bx &&

ay < by+bh &&

ay+ah > by

);

}


/* =====================
   ライフ
===================== */

function updateLife(){

  lifeText.textContent =
  "LIFE " +
  "❤️".repeat(life);

}


function damage(){

  if(
    invincible ||
    gameEnded
  ){
    return;
  }

  life--;

  updateLife();


  if(life <= 0){

    gameEnded = true;

    showEnd(
      "GAME OVER",
      "ライフがなくなりました"
    );

    return;
  }


  /* ノックバック */

  x -= 80;

  if(x < 0){
    x = 0;
  }

  vy = -5;


  /* 無敵時間 */

  invincible = true;

  invincibleTimer = 100;

  hero.classList.add(
    "invincible"
  );

}


/* =====================
   終了画面
===================== */

function showEnd(title,text){

  messageTitle.textContent =
  title;

  messageText.textContent =
  text;

  message.style.display =
  "flex";

}


/* =====================
   キーボード
===================== */

document.addEventListener(
"keydown",
function(e){

  keys[e.key] = true;


  if(
    (
      e.key === " " ||
      e.key === "ArrowUp"
    )
    &&
    onGround
    &&
    !gameEnded
  ){

    vy = jumpPower;

    onGround = false;

  }


  if(
    e.key === "ArrowLeft" ||
    e.key === "ArrowRight" ||
    e.key === "ArrowUp" ||
    e.key === " "
  ){

    e.preventDefault();

  }

});


document.addEventListener(
"keyup",
function(e){

  keys[e.key] = false;

});


/* =====================
   iPhoneボタン
===================== */

function holdButton(
button,
key
){

button.addEventListener(
"pointerdown",
function(e){

  e.preventDefault();

  keys[key] = true;

});


button.addEventListener(
"pointerup",
function(){

  keys[key] = false;

});


button.addEventListener(
"pointercancel",
function(){

  keys[key] = false;

});

}


holdButton(
document.getElementById(
"leftBtn"
),
"ArrowLeft"
);


holdButton(
document.getElementById(
"rightBtn"
),
"ArrowRight"
);


document
.getElementById(
"jumpBtn"
)
.addEventListener(
"pointerdown",
function(e){

  e.preventDefault();


  if(
    onGround &&
    !gameEnded
  ){

    vy = jumpPower;

    onGround = false;

  }

});


/* =====================
   敵
===================== */

function updateEnemies(){

enemies.forEach(
function(enemy){

  if(!enemy.alive){
    return;
  }


  enemy.x +=
  enemy.vx;


  if(
    enemy.x <=
    enemy.minX
  ){

    enemy.x =
    enemy.minX;

    enemy.vx =
    Math.abs(
      enemy.vx
    );

  }


  if(
    enemy.x >=
    enemy.maxX
  ){

    enemy.x =
    enemy.maxX;

    enemy.vx =
    -Math.abs(
      enemy.vx
    );

  }


  /* たまにジャンプ */

  if(
    enemy.onGround &&
    Math.random() < 0.007
  ){

    enemy.vy =
    enemy.jump;

    enemy.onGround =
    false;

  }


  enemy.vy +=
  0.55;


  enemy.y +=
  enemy.vy;


  if(
    enemy.y >= 366
  ){

    enemy.y = 366;

    enemy.vy = 0;

    enemy.onGround =
    true;

  }


  enemy.el.style.left =
  enemy.x + "px";


  enemy.el.style.top =
  enemy.y + "px";

});

}


/* =====================
   プレイヤー
===================== */

function updatePlayer(){

if(gameEnded){
  return;
}


let moving = false;


/* 右 */

if(
keys["ArrowRight"]
){

  x += 6;

  moving = true;

  facingRight = true;

}


/* 左 */

if(
keys["ArrowLeft"]
){

  x -= 6;

  moving = true;

  facingRight = false;

}


if(x < 0){
  x = 0;
}


if(x > 3140){
  x = 3140;
}


/* 重力 */

const oldY = y;


vy += gravity;

y += vy;


onGround = false;


/* 地面 */

if(
y >= groundY
){

  y = groundY;

  vy = 0;

  onGround = true;

}


/* 足場 */

platforms.forEach(
function(platform){

const px =
parseInt(
platform.style.left
);

const py =
parseInt(
platform.style.top
);

const pw =
parseInt(
platform.style.width
);


const oldBottom =
oldY +
playerH;


const newBottom =
y +
playerH;


if(

x + playerW > px &&

x < px + pw &&

vy >= 0 &&

oldBottom <= py &&

newBottom >= py

){

y =
py -
playerH;

vy = 0;

onGround = true;

}

});


/* =====================
   主人公アニメ
===================== */

if(!onGround){

  setHeroFrame(5);

}

else if(moving){

  animationCounter++;


  if(
    animationCounter > 6
  ){

    animationCounter = 0;

    runFrame++;


    if(runFrame > 4){

      runFrame = 1;

    }

  }


  setHeroFrame(
    runFrame
  );

}

else{

  setHeroFrame(0);

}


/* 左右向き */

if(facingRight){

  hero.style.transform =
  "scaleX(1)";

}

else{

  hero.style.transform =
  "scaleX(-1)";

}


/* =====================
   コイン
===================== */

coins.forEach(
function(coin){

if(coin.taken){
  return;
}


if(

hit(

x,
y,
playerW,
playerH,

coin.x,
coin.y,
28,
28

)

){

coin.taken = true;

coin.el.style.display =
"none";

score++;

scoreText.textContent =
"COIN × " +
score;

}

});


/* =====================
   敵との接触
===================== */

enemies.forEach(
function(enemy){

if(!enemy.alive){
  return;
}


if(

hit(

x,
y,
playerW,
playerH,

enemy.x,
enemy.y,
enemy.w,
enemy.h

)

){

const oldBottom =
oldY +
playerH;


/* 上から踏む */

if(

vy > 0 &&

oldBottom <=
enemy.y + 14

){

enemy.alive =
false;

enemy.el.style.display =
"none";

vy = -10;

score += 3;

scoreText.textContent =
"COIN × " +
score;

}


/* 横から */

else{

damage();

}

}

});


/* =====================
   ゴール
===================== */

if(

hit(

x,
y,
playerW,
playerH,

2940,
175,
130,
245

)

){

gameEnded = true;

showEnd(

"GAME CLEAR!",

"スコア：" +
score

);

}

}


/* =====================
   無敵
===================== */

function updateInvincible(){

if(!invincible){
  return;
}


invincibleTimer--;


if(
invincibleTimer <= 0
){

invincible = false;

hero.classList.remove(
"invincible"
);

}

}


/* =====================
   カメラ
===================== */

function updateScreen(){

player.style.left =
x + "px";


player.style.top =
y + "px";


cameraX =

x -

window.innerWidth *
0.35;


if(cameraX < 0){

  cameraX = 0;

}


const maxCamera =

3200 -

window.innerWidth;


if(
cameraX >
maxCamera
){

cameraX =
Math.max(
0,
maxCamera
);

}


world.style.left =
-cameraX +
"px";

}


/* =====================
   ゲームループ
===================== */

function loop(){

updatePlayer();

updateEnemies();

updateInvincible();

updateScreen();

requestAnimationFrame(
loop
);

}


/* 再スタート */

document
.getElementById(
"restart"
)
.addEventListener(
"click",
function(){

location.reload();

});


updateLife();

setHeroFrame(0);

loop();

</script>

</body>
</html>
